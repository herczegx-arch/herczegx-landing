# A nevjegy statikus oldal: nincs build, a mappa tartalma megy ki.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/kepek/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
